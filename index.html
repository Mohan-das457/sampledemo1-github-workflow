
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px #0003;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        button {
            border: none;
            padding: 10px 14px;
            background: #667eea;
            color: white;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #4c5fd5;
        }

        ul {
            list-style: none;
            margin-top: 20px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3f3f3;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 7px;
        }

        li.completed span {
            text-decoration: line-through;
            color: gray;
        }

        .delete {
            background: #e74c3c;
            padding: 7px 10px;
        }

        .delete:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>My Task App</h1>

        <div class="input-box">
            <input type="text" id="taskInput"
                placeholder="Enter your task">

            <button onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");

            let span = document.createElement("span");
            span.textContent = task;

            span.onclick = function() {
                li.classList.toggle("completed");
            };

            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "delete";

            deleteBtn.onclick = function() {
                li.remove();
            };

            li.appendChild(span);
            li.appendChild(deleteBtn);

            document.getElementById("taskList")
                .appendChild(li);

            input.value = "";
        }
    </script>

</body>
</html>
